<link rel="icon" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הסטודיו של שי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first studio binder. A bar/mat switch on top, three tabs at the bottom, lesson cards that open into a full plan. */
:root {
  --bg: #eef0ea;
  --card: #fbfbf8;
  --fg: #23302b;
  --muted: #5f6b65;
  --line: #d5dbd2;
  --accent: #6b4c7a;      /* plum: barre */
  --accent-soft: #ece4f0;
  --mat: #3f6f5e;         /* deep sage: mat */
  --mat-soft: #dde9e2;
  --warn: #a2541c;
  --warn-soft: #f6e6d8;
  --ok: #2f7a4f;
  --font-display: "Suez One", "Assistant", Georgia, serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b19; --card: #1f2522; --fg: #e8ece7; --muted: #a3ada7; --line: #333c37;
  --accent: #c7a6d6; --accent-soft: #2e2533; --mat: #8fc7ae; --mat-soft: #1f322b;
  --warn: #f0a46c; --warn-soft: #3a2a1d; --ok: #7cc39c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161b19; --card: #1f2522; --fg: #e8ece7; --muted: #a3ada7; --line: #333c37;
  --accent: #c7a6d6; --accent-soft: #2e2533; --mat: #8fc7ae; --mat-soft: #1f322b;
  --warn: #f0a46c; --warn-soft: #3a2a1d; --ok: #7cc39c; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px }
body.mode-mat { --tone: var(--mat); --tone-soft: var(--mat-soft) }
body.mode-barre { --tone: var(--accent); --tone-soft: var(--accent-soft) }
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
button, input, select, textarea { font: inherit; color: inherit }
button, a, .chip, .item { touch-action: manipulation; -webkit-tap-highlight-color: transparent }
button:active { transform: scale(.98) }
h1, h2, h3 { text-wrap: balance }
:focus-visible { outline: 3px solid var(--tone); outline-offset: 2px }

header { padding-block: 22px 0; display: flex; flex-direction: column; gap: 14px }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; line-height: 1.1 }
.small-btn { min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px 12px; cursor: pointer; font-size: 15px; color: var(--muted) }
.switch { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px }
.switch button { min-height: 50px; border: 0; border-radius: 10px; background: transparent; font-size: 18px; font-weight: 700; cursor: pointer; color: var(--muted) }
.switch button[aria-pressed="true"] { background: var(--tone); color: var(--card) }

.tabs { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
.tabs button { min-height: 58px; border: 0; background: transparent; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; border-top: 3px solid transparent }
.tabs button[aria-selected="true"] { color: var(--tone); border-top-color: var(--tone) }

.today { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.today b { font-size: 15px }
.hint { font-size: 13px; color: var(--muted) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { min-height: 44px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg); cursor: pointer; font-size: 15px }
.chip[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--fg); font-weight: 700 }
.chip.f[aria-pressed="true"] { background: var(--tone-soft); border-color: var(--tone) }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 6px 0 0 }
.lead { margin: 0; color: var(--muted); font-size: 15px }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }

.plans { display: grid; gap: 10px }
.plan-card { text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; border-inline-start: 5px solid var(--tone) }
.plan-card.mine { border-inline-start-style: double; border-inline-start-width: 6px }
.plan-card .t { font-weight: 700; font-size: 18px }
.plan-card .d { color: var(--muted); font-size: 15px }
.plan-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.tag { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--tone-soft); color: var(--fg) }
.tag.w { background: var(--warn-soft) }
.tag.last { background: transparent; border: 1px solid var(--line); color: var(--muted) }
.empty { background: var(--card); border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px 16px; color: var(--muted); font-size: 15px }

.plan-view { display: flex; flex-direction: column; gap: 14px }
.back { align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: var(--tone); font-weight: 700; cursor: pointer; padding: 0 }
.plan-head { display: flex; flex-direction: column; gap: 6px }
.plan-head h2 { margin: 0; font-size: 26px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { min-height: 46px; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--tone); background: var(--tone); color: var(--card); font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.btn.ghost { background: transparent; color: var(--tone) }
.btn.done { background: var(--ok); border-color: var(--ok); color: var(--card) }
.btn.danger { background: transparent; border-color: var(--warn); color: var(--warn) }
.btn.wide { width: 100%; justify-content: center }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.sec-h { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--tone-soft); font-weight: 700 }
.sec-h span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums }
.item { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; text-align: start; width: 100%; background: transparent; border-inline: 0; border-bottom: 0 }
.sec .item:first-of-type { border-top: 0 }
.item .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }
.item .nm { font-weight: 700 }
.item .ds { color: var(--muted); font-size: 14px; text-align: end; min-width: 0 }
.alert { font-size: 14px; background: var(--warn-soft); border-inline-start: 3px solid var(--warn); padding: 6px 10px; border-radius: 6px; color: var(--fg) }
.alert b { color: var(--warn) }
.alert.no { border-inline-start-width: 5px; font-weight: 600 }
.confirm { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px }

/* edit mode */
.field { display: flex; flex-direction: column; gap: 4px }
.field label { font-weight: 700; font-size: 15px }
.inp { width: 100%; min-height: 46px; font-size: 16px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg) }
textarea.inp { min-height: 80px; resize: vertical }
.inp:focus { border-color: var(--tone) }
.bk-remind { background: var(--card); border: 1.5px solid var(--tone); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; display: grid; gap: 10px }
.bk-remind p { margin: 0 }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.locked .tabs, .locked .switch, .locked .brand .small-btn { display: none }
.lock { max-width: 380px; margin: 48px auto 0; display: grid; gap: 14px; text-align: center }
.lock p { margin: 0; color: var(--muted) }
.lock form { display: grid; gap: 14px }
.app-foot { margin: 28px 0 8px; padding-top: 14px; border-top: 1px solid var(--line, #ddd); display: grid; gap: 8px; justify-items: center; text-align: center; font-size: 14px; color: var(--muted) }
.app-foot p { margin: 0 }
.app-foot .linkish { min-height: 32px }
.sub-lead { margin: 0 0 8px; color: var(--muted); font-size: 14px }
.vers, .adapts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px }
.vers li { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; line-height: 1.5 }
.vtag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line, #ccc); white-space: nowrap }
.vtag.easy { color: var(--tone) }
.vtag.hard { color: #b3261e }
.adapts li { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--line, #ddd); border-radius: 10px; line-height: 1.5 }
.ad-rep i { font-style: normal; font-weight: 700; color: var(--tone) }
.tour { display: grid; gap: 12px; justify-items: center; text-align: center }
.tour-ic { font-size: 44px; line-height: 1 }
.tour p { margin: 0; line-height: 1.7; font-size: 17px }
.tour-dots { display: flex; gap: 6px }
.tour-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line, #ccc) }
.tour-dots span.on { background: var(--tone) }
.tour .row { display: flex; gap: 8px; justify-content: center }
.rules { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 10px }
.rules li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; line-height: 1.5 }
.rules .ok { color: var(--tone); font-weight: 700 }
.rules .no { color: #b3261e; font-weight: 700 }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--tone); text-decoration: underline; cursor: pointer }
.lock .err { color: var(--warn); font-weight: 700; min-height: 1.4em }
.sec-edit { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px }
.sec-edit .sec-row { display: grid; grid-template-columns: 1fr 84px auto; gap: 8px; align-items: center }
.ed-item { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px }
.ed-item .nm { font-weight: 700; background: none; border: 0; padding: 0; text-align: start; cursor: pointer; color: var(--fg) }
.ad-alts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px }
.ad-alts i { flex-basis: 100%; font-style: normal; font-weight: 600 }
.alt-btn { min-height: 40px; padding: 6px 12px; border: 1px solid var(--tone); background: var(--tone-soft); color: var(--fg); border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px }
.alt-btn small { color: var(--muted) }
.ed-row { display: flex; align-items: center; gap: 8px }
.ed-row .nm { flex: 1; min-height: 44px }
.ed-row .ds { color: var(--muted); font-size: 14px }
.ed-sec { margin: -12px -12px 0; border-radius: 14px 14px 0 0 }
.wiz-step { margin: 0; color: var(--tone); font-weight: 700; font-size: 14px }
.more-set { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px }
.more-set summary { cursor: pointer; padding: 14px 0; font-weight: 700; min-height: 44px }
.more-body { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px }
.more-body .sec-row { display: grid; grid-template-columns: 1fr 84px auto; gap: 8px; align-items: center }
.item-menu { display: flex; flex-direction: column; gap: 8px }
.item-menu .btn { justify-content: flex-start }
.item-menu .btn.wide { justify-content: center; margin-top: 4px }
.add-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); font-size: 14px }
.ed-item .ctl { display: grid; grid-template-columns: 1fr repeat(4, 44px); gap: 6px; align-items: center }
.icon-btn { min-height: 44px; min-width: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; cursor: pointer; font-size: 16px }
.icon-btn:disabled { opacity: .35; cursor: default }

.search { width: 100%; min-height: 46px; font-size: 16px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg) }
.lib { display: grid; gap: 8px }
.ex { background: var(--card); border: 1px solid var(--line); border-radius: 12px }
.count { font-size: 14px; color: var(--muted) }
.own-badge { font-size: 12px; font-weight: 700; color: var(--tone); border: 1px solid var(--tone); border-radius: 6px; padding: 0 6px; margin-inline-start: 6px }
.vid-badge { font-size: 12px; color: var(--muted); margin-inline-start: 6px }

.guide { display: flex; flex-direction: column; gap: 12px }
.disclaimer { font-size: 14px; background: var(--card); border: 1px dashed var(--warn); border-radius: 12px; padding: 10px 14px }
details.pop { background: var(--card); border: 1px solid var(--line); border-radius: 14px }
details.pop summary { cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 18px; list-style: none; display: flex; justify-content: space-between; gap: 8px }
details.pop summary::after { content: "+"; color: var(--tone); font-size: 22px; line-height: 1 }
details.pop[open] summary::after { content: "–" }
details.tips { margin-bottom: 14px }
details.tips h4 { margin: 10px 0 4px }
details.tips ul { margin: 0; padding-inline-start: 20px }
.pop-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px }
details.pop summary > span:first-child { flex: 1 }
.sum-hint { font-size: 14px; font-weight: 400; color: var(--mute, #a3ada7); align-self: center }
.btn.big { min-height: 56px; font-size: 18px }
.pop-body .today { border: 0; padding: 0; background: none }
.pop-body .btn.wide { justify-content: center }
details.pop summary::-webkit-details-marker { display: none }
.pop-body h3 { margin: 6px 0 0; font-size: 15px; color: var(--tone) }
.pop-body ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px }

.plan-group { margin: 14px 0 6px; font-size: 16px; color: var(--tone) }
.plan-group .hint { font-weight: 400 }

/* ===== Learn ===== */
.learn-intro { line-height: 1.65 }
.lesson-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px }
.lesson-card { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; font: inherit; color: inherit; min-height: 58px }
.lesson-card .num { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); font-weight: 700 }
.lesson-card.read .num { background: var(--tone); color: var(--card) }
.lesson-card .t { flex: 1; font-weight: 700; font-size: 17px }
.lesson-card .d { width: 100%; padding-inline-start: 44px; font-size: 14px; color: var(--muted) }
.lesson-view { display: flex; flex-direction: column; gap: 12px; line-height: 1.65 }
.lesson-view h2 { margin: 0 }
.lesson-view h3 { margin: 12px 0 0; font-size: 17px; color: var(--tone) }
.lesson-view p, .lesson-view ul, .lesson-view ol { margin: 0 }
.lesson-view ul, .lesson-view ol { padding-inline-start: 22px; display: flex; flex-direction: column; gap: 4px }
.lesson-view .bottom { background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--tone); border-radius: 10px; padding: 12px 14px }
.lesson-view .dispute { border: 1px dashed var(--warn); border-radius: 10px; padding: 10px 12px }
.tbl { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line) }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card) }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: start; vertical-align: top }
.tbl th { color: var(--tone) }
.cite { font: inherit; font-size: 11px; font-weight: 700; vertical-align: super; line-height: 1; border: 0; background: none; color: var(--tone); padding: 2px 2px; cursor: pointer }
.verify { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; white-space: nowrap }
.srcs ol { margin: 0; padding-inline-start: 26px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; overflow-wrap: anywhere }
.srcs li.hl { outline: 2px solid var(--tone); outline-offset: 2px; border-radius: 4px }
.srcs a { color: var(--tone) }
.lesson-nav { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px }
.links { display: flex; flex-wrap: wrap; gap: 6px }
.link { min-height: 36px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 14px }
.link.barre { border-color: var(--accent) }
.link.mat { border-color: var(--mat) }

.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--card); width: 100%; max-width: 720px; max-height: 90%; overflow: auto; overscroll-behavior: contain; border-radius: 18px 18px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px }
.sheet h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 }
.sheet .en { color: var(--muted); margin-top: -8px }
.sheet h4 { margin: 4px 0 0; font-size: 15px; color: var(--tone) }
.sheet ul { margin: 0; padding-inline-start: 20px }
.sheet p { margin: 0 }
.video { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center }
.video video { width: 100%; max-height: 60vh; border-radius: 10px; background: #000 }
.close { align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: var(--tone); font-weight: 700; cursor: pointer; padding: 0 }
.pick { display: flex; flex-direction: column; gap: 6px }
.pick button { text-align: start; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; cursor: pointer; display: flex; flex-direction: column }
.pick button small { color: var(--muted) }
.pick-note { font-size: 13px; color: var(--ink, inherit); margin-top: 2px }
.pick-ok { font-size: 13px; color: var(--mat); margin-top: 2px }
.pick-pop { margin: 4px 0 10px }
.pick-lbl { display: block; font-weight: 600; margin-bottom: 6px }
.pick-more { margin-top: 10px }
.pick-more summary { cursor: pointer; padding: 8px 0; color: var(--muted) }
.file-btn { position: relative; overflow: hidden }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
.note-local { font-size: 13px; color: var(--muted) }

.class-mode { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)) }
.class-mode .cm-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap }
.class-mode .cm-sec { font-family: var(--font-display); font-size: 24px; margin: 18px 0 6px; color: var(--tone) }
.class-mode .cm-it { font-size: 26px; font-weight: 700; padding: 10px 0; border-bottom: 1px solid var(--line); line-height: 1.25 }
.class-mode .cm-it small { display: block; font-size: 18px; font-weight: 400; color: var(--muted) }
.class-mode .cm-it .alert { font-size: 17px; margin-top: 6px; font-weight: 400 }
.wl { font-size: 13px; color: var(--muted) }
.toast { position: fixed; z-index: 60; inset-inline: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 14px; text-align: center; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.vmeter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 0 }
.vmeter span { display: block; height: 100%; background: var(--tone) }
.vmeter.full span { background: #b3412e }
.share-row { margin-top: 8px }
#print-area { display: none }
@media print {
  body > *:not(#print-area) { display: none !important }
  body { background: #fff !important }
  #print-area { display: block; color: #000; font-size: 13pt; line-height: 1.5 }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Boot: sign in, get the content from the cloud (Supabase project "shai-studio"), then start the app.
   - Built-in content (POP, GUIDE, BARRE_TIPS, EX, PLANS) lives in table "content".
   - Shai's own plans / exercises / "taught today" live in "plans", "exercises", "taught".
   - The phone keeps a working copy (localStorage "shai_db") and a copy of what the cloud has ("shai_synced").
     Every save sends only the difference. Offline: the app works from the copies and sends later.
   - First run on this computer (localhost with data.js): if the cloud is empty, data.js is uploaded once. ===== */
(function () {
  const SB_URL = "https://fzwnsoektgpfawpmneei.supabase.co";
  const SB_KEY = "sb_publishable_vxAzEuHhiA1jH3oZZtigDg_80Pex3Ez";   // public key, safe in the browser (tables are locked with RLS)
  const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const main = document.getElementById("main");
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
  const addScript = text => { const s = document.createElement("script"); s.textContent = text; document.body.appendChild(s); };
  const loadScript = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  const say = (html) => { document.body.classList.add("locked"); main.innerHTML = `<div class="lock">${html}</div>`; };
  let started = false;
  const startApp = () => { if (started) return; started = true; document.body.classList.remove("locked"); addScript(document.getElementById("app-code").textContent); };

  if (!window.supabase) { say(`<h2>אין חיבור</h2><p>צריך אינטרנט כדי לפתוח את האפליקציה בפעם הראשונה. נסי שוב בעוד רגע.</p>`); return; }
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "shai_sb_auth" } });

  /* ---- Sync: compare the working copy with the cloud copy and send only what changed ---- */
  const snapOf = db => {
    const s = { p: {}, e: {}, t: {} };
    (db.plans || []).forEach((p, i) => { s.p[p.id] = JSON.stringify([p, i]); });
    Object.values(db.ex || {}).forEach(x => { s.e[x.id] = JSON.stringify(x); });
    Object.entries(db.log || {}).forEach(([pid, days]) => (days || []).forEach(d => { s.t[pid + "|" + d] = 1; }));
    return s;
  };
  let busy = false, again = false, timer = null;
  async function syncNow() {
    if (busy) { again = true; return; }
    busy = true;
    try {
      const db = ls.get("shai_db", { plans: [], ex: {}, log: {} });
      const cur = snapOf(db), old = ls.get("shai_synced", { p: {}, e: {}, t: {} });
      const upP = [], upE = [], addT = [], delT = [];
      for (const id in cur.p) if (cur.p[id] !== old.p[id]) { const [p, i] = JSON.parse(cur.p[id]); upP.push({ id, data: p, sort: i, deleted: false }); }
      for (const id in old.p) if (!(id in cur.p)) upP.push({ id, data: JSON.parse(old.p[id])[0], sort: 0, deleted: true });
      for (const id in cur.e) if (cur.e[id] !== old.e[id]) upE.push({ id, data: JSON.parse(cur.e[id]), deleted: false });
      for (const id in old.e) if (!(id in cur.e)) upE.push({ id, data: JSON.parse(old.e[id]), deleted: true });
      for (const k in cur.t) if (!old.t[k]) { const i = k.lastIndexOf("|"); addT.push({ plan_id: k.slice(0, i), day: k.slice(i + 1) }); }
      for (const k in old.t) if (!cur.t[k]) delT.push(k);
      if (!upP.length && !upE.length && !addT.length && !delT.length) return true;
      const chk = r => { if (r.error) throw r.error; };
      if (upP.length) chk(await sb.from("plans").upsert(upP));
      if (upE.length) chk(await sb.from("exercises").upsert(upE));
      if (addT.length) chk(await sb.from("taught").upsert(addT, { onConflict: "plan_id,day", ignoreDuplicates: true }));
      for (const k of delT) { const i = k.lastIndexOf("|"); chk(await sb.from("taught").delete().match({ plan_id: k.slice(0, i), day: k.slice(i + 1) })); }
      ls.set("shai_synced", cur);
      return true;
    } catch (e) { console.warn("[shai] sync failed, will retry", e); return false; }
    finally { busy = false; if (again) { again = false; setTimeout(syncNow, 300); } }
  }
  window.CLOUD = {
    sync() { clearTimeout(timer); timer = setTimeout(syncNow, 700); },
    async signOut() { await syncNow(); await sb.auth.signOut(); ["shai_synced", "shai_db", "shai_content"].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); location.reload(); },
    email: "",
    sb,
  };
  window.addEventListener("online", () => CLOUD.sync());

  /* ---- Content ---- */
  function useContent(c) { ["POP", "GUIDE", "BARRE_TIPS", "EX", "PLANS"].forEach(k => { window[k] = c[k]; }); }
  async function seedFromDataJs() {
    await loadScript("data.js");   // defines POP, GUIDE, BARRE_TIPS, EX, PLANS
    const rows = [["POP", POP], ["GUIDE", GUIDE], ["BARRE_TIPS", typeof BARRE_TIPS !== "undefined" ? BARRE_TIPS : []], ["EX", EX], ["PLANS", PLANS]].map(([key, data]) => ({ key, data }));
    const r = await sb.from("content").upsert(rows); if (r.error) throw r.error;
    return Object.fromEntries(rows.map(r => [r.key, JSON.parse(JSON.stringify(r.data))]));
  }

  async function loadAndStart() {
    say(`<p>טוען...</p>`);
    await syncNow();   // send what was changed here before taking the cloud copy
    let content = null, cloud = null;
    try {
      const [c, p, x, t] = await Promise.all([
        sb.from("content").select("key,data"),
        sb.from("plans").select("id,data,sort").eq("deleted", false).order("sort"),
        sb.from("exercises").select("id,data").eq("deleted", false),
        sb.from("taught").select("plan_id,day").order("day"),
      ]);
      [c, p, x, t].forEach(r => { if (r.error) throw r.error; });
      content = Object.fromEntries(c.data.map(r => [r.key, r.data]));
      cloud = { plans: p.data.map(r => r.data), ex: {}, log: {} };
      x.data.forEach(r => { cloud.ex[r.id] = r.data; });
      t.data.forEach(r => { (cloud.log[r.plan_id] = cloud.log[r.plan_id] || []).push(r.day); });
    } catch (e) { console.warn("[shai] offline or cloud error", e); }

    if (content && !content.EX) {
      if (!LOCAL) { say(`<h2>עוד רגע</h2><p>התוכן עוד לא הועלה לענן. גיא צריך לפתוח את האפליקציה פעם אחת מהמחשב.</p>`); return; }
      try { content = await seedFromDataJs(); } catch (e) { console.error(e); say(`<h2>ההעלאה לענן נכשלה</h2><p>נסו שוב.</p>`); return; }
    }
    if (content) { ls.set("shai_content", content); }
    else { content = ls.get("shai_content", null); if (!content) { say(`<h2>אין חיבור</h2><p>צריך אינטרנט כדי לפתוח את האפליקציה בפעם הראשונה. נסי שוב בעוד רגע.</p>`); return; } }
    if (!window.POP) useContent(content);   // data.js (seed) already defined them

    if (cloud) {   // the cloud is the truth; keep this device's view settings
      const local = ls.get("shai_db", {});
      ls.set("shai_db", Object.assign({}, local, { v: 1, plans: cloud.plans, ex: cloud.ex, log: cloud.log }));
      ls.set("shai_synced", snapOf(cloud));
    }
    startApp();
  }

  function loginScreen(msg) {
    say(`<form id="login-form">
      <h2>ברוכה הבאה</h2>
      <p>נכנסים פעם אחת, והטלפון יזכור.</p>
      <label for="login-email" class="sr-only">מייל</label>
      <input class="inp" id="login-email" type="email" autocomplete="username" inputmode="email" dir="ltr" placeholder="מייל" required>
      <label for="login-pass" class="sr-only">סיסמה</label>
      <input class="inp" id="login-pass" type="password" autocomplete="current-password" dir="ltr" placeholder="סיסמה" required>
      <button class="btn wide" type="submit">כניסה</button>
      <div class="err" role="alert">${msg || ""}</div></form>`);
    const form = document.getElementById("login-form");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const btn = form.querySelector("button"), err = form.querySelector(".err");
      btn.disabled = true; btn.textContent = "נכנסת..."; err.textContent = "";
      const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById("login-email").value.trim().toLowerCase(), password: document.getElementById("login-pass").value });
      if (error) { btn.disabled = false; btn.textContent = "כניסה"; err.textContent = /invalid/i.test(error.message) ? "המייל או הסיסמה לא נכונים. נסי שוב." : "אין חיבור לאינטרנט. נסי שוב בעוד רגע."; return; }
      CLOUD.email = data.user.email; loadAndStart();
    });
  }

  sb.auth.getSession().then(({ data }) => {
    if (data.session) { CLOUD.email = data.session.user.email; loadAndStart(); }
    else loginScreen();
  }).catch(() => loginScreen());
})();
</script>
<!--LEARN-START--><script>window.LEARN = [{"id":"t1","title":"להבין את הבטן: לחץ, היפרדות ומה עושים בשיעור","note":"**חשוב לפני שמתחילות:** זה מידע מקצועי כללי למדריכת פילאטיס, לא ייעוץ רפואי. אבחנה של היפרדות בטנית, וגם ההחלטה על טיפול, שייכות לרופאה או לפיזיותרפיסטית של רצפת האגן (pelvic health physiotherapist). כל עובדה כאן מגיעה ממקור ברשימה שבסוף ([n]). מה שמסומן **(לאימות)** נראה רק בתקציר קצר של תוצאת חיפוש, ולא נבדק במקור המלא.","intro":"הבטן עובדת כמו גליל סגור: סרעפת למעלה, רצפת אגן למטה, שרירי בטן מסביב. כשכולם עובדים יחד, הלחץ בפנים עולה ומחזיק [1][5]. היפרדות בטנית היא מתיחה של רקמת החיבור שבאמצע הבטן, לא קרע בשריר. בסוף ההיריון היא קיימת כמעט אצל כולן, ואצל רובן היא מצטמצמת לבד במהלך השנה שאחרי הלידה [19][20][25]. המחקר כבר לא אוסר כפיפות בטן. כפיפה מצמצמת את הרווח ברגע ותוכנית כפיפות לא החמירה אותו, אבל שום תוכנית תרגילים לא \"סוגרת\" אותו באופן משמעותי [42][45][46]. התפקיד שלך הוא לראות איך הבטן מגיבה למאמץ (האם האמצע מתרומם ככיפה), להתאים את התרגיל, ולהפנות לפיזיותרפיסטית כשצריך [5][24].","pages":[{"title":"שיעור 1: מה זה לחץ תוך בטני","sub":"מה זה \"הגליל\" של הבטן, מה קורה בו בנשימה, ואילו פעולות מעלות את הלחץ.","md":"**בשיעור הזה:** מה זה \"הגליל\" של הבטן, מה קורה בו בנשימה, ואילו פעולות מעלות את הלחץ.\n\n### הבטן היא גליל לחוץ\n\n**לחץ תוך בטני** (intra-abdominal pressure, IAP) הוא הלחץ בתוך חלל הבטן, החלל הסגור שבו נמצאים האיברים. לחלל הזה יש \"קירות\":\n\n| חלק בגליל | השריר | הסבר קצר |\n|---|---|---|\n| מכסה | **סרעפת** (diaphragm) | שריר הנשימה הראשי, בצורת כיפה, מתחת לצלעות |\n| רצפה | **רצפת האגן** (pelvic floor) | שכבת שרירים שסוגרת את האגן מלמטה |\n| קירות מקדימה ומהצדדים | **שרירי הבטן**, ובעיקר **השריר הרוחבי** (transversus abdominis, TrA) | השריר העמוק ביותר בבטן, שמקיף אותה כמו חגורה |\n| קיר אחורי | **שרירי הגב העמוקים** (multifidus) | כך מלמדים את המודל. לא מצאנו מחקר שמדד את חלקם בלחץ |\n\nאת התמונה של \"הגליל\" (canister/cylinder) מלמדים פיזיותרפיסטים: הסרעפת מכסה מלמעלה ורצפת האגן סוגרת מלמטה [6] (לאימות). החוברת של POGP (ארגון הפיזיותרפיסטיות לבריאות האישה בבריטניה) קוראת לשריר הרוחבי \"גליל היציבות\" (cylinder of stability) [5]. הפיזיותרפיסטית ג\u0027ולי וויבי (Julie Wiebe, DPT) משתמשת בדימוי של **בוכנה** (piston): הסרעפת ורצפת האגן זזות יחד עם כל נשימה, ושני השרירים, השריר הרוחבי והגב העמוק, עובדים כצוות [7] (לאימות).\n\n### מה המחקר מראה על הגליל\n\nמחקר של הודג\u0027ס וגנדביה (Hodges \u0026 Gandevia, 2000) מדד בבת אחת את פעילות הסרעפת, את השריר הרוחבי ואת הלחץ בבטן, אצל מבוגרים בריאים שהזיזו את הידיים שוב ושוב. שני השרירים נשארו פעילים כל הזמן, והלחץ עלה בהתאם לכוח של תנועת הידיים. לפי החוקרים, **כשהסרעפת ושרירי הבטן מתכווצים יחד, הלחץ בבטן עולה ונשאר גבוה.** בנשימה רגילה, לעומת זאת, הם עובדים \"זה מול זה\" ומשנים את צורת החלל הלחוץ [1]. מחקר המשך הראה שהסרעפת יכולה לעשות שתי עבודות בבת אחת, לנשום ולייצב [2] (לאימות). סקירה של הודג\u0027ס מתארת את השריר הרוחבי כשריר הבטן שהכי קשור לשינויי הלחץ, ומציינת שהוא מתחיל לעבוד עוד לפני שהיד זזה [3] (לאימות).\n\nרצפת האגן היא חלק פעיל בגליל. התכווצות מקסימלית של רצפת האגן, בשכיבה, העלתה את הלחץ בבטן בכ־10 מ\"מ כספית בממוצע [8].\n\n**יש מחלוקת:** סקירה אחת מ־2016 טוענת שהרעיון שהשריר הרוחבי והסרעפת \"מייצבים את עמוד השדרה בעזרת לחץ\" לא הוכח היטב בניסויים, ושזה כנראה תפקיד משני שלהם [4] (לאימות). כלומר, הגליל עצמו מבוסס היטב. כמה הוא \"מגן על הגב\" עדיין לא ברור.\n\n### מה קורה בנשימה\n\n- **בשאיפה:** הסרעפת מתכווצת ויורדת, דוחפת את תוכן הבטן למטה ולצדדים, והלחץ עולה [9] (לאימות).\n- **בנשיפה:** לפי סקירה של טלאש (Talasz) ועמיתיו, רצפת האגן פועלת כ\"שריר נשיפה\" יחד עם שרירי הבטן. היא מתכווצת בנשיפה ומרפה בשאיפה [10] (לאימות).\n- **יש מחלוקת:** תקציר של כנס ICS לא מצא הבדל בפעילות רצפת האגן ושרירי הבטן בין שאיפה לנשיפה [9] (לאימות). כך שהתזמון המדויק של רצפת האגן בנשימה עדיין לא סגור.\n- **לא כולן נושמות אותו דבר:** במחקר אולטרסאונד (בדיקת הדמיה בגלי קול) של 150 אנשים בריאים, כמעט שליש כמעט לא הראו התעבות של הסרעפת בנשימה רגילה [11] (לאימות).\n\nלא מצאנו מחקר שמדד בכמה הלחץ משתנה במהלך נשימה רגילה אחת.\n\n### כמה לחץ יש בבטן, ומה מעלה אותו\n\n**שתי יחידות מידה, שאסור לערבב:** חלק מהמחקרים מודדים ב**מ\"מ כספית** (mmHg) וחלק ב**ס\"מ מים** (cm H2O). מ\"מ כספית אחד שווה בערך 1.36 ס\"מ מים [14]. גם המקום שבו מודדים שונה (שלפוחית השתן או פי הטבעת), ולכן אי אפשר להשוות ישירות מספרים בין מחקרים.\n\n**במנוחה:** בשכיבה הלחץ נמוך, בערך 0–7 מ\"מ כספית [12] (לאימות).\n\n**מחקר Cobb ועמיתיו (2005), מ\"מ כספית:** 20 מבוגרים בריאים בני 18–30, מדידה דרך השלפוחית, 13 פעולות [13].\n\n| פעולה | לחץ ממוצע (מ\"מ כספית) |\n|---|---|\n| ישיבה | 16.7 |\n| עמידה | 20 |\n| הרמת משקולות של 10 ליברות (כ־4.5 ק\"ג) בכפיפת ברכיים | עד 25.5 |\n| שיעול | 107.6 |\n| קפיצה (הגבוה ביותר) | 171 |\n\nבמחקר הזה לא היה הבדל בין נשים לגברים, ובחלק מהפעולות (5 מתוך 13) BMI גבוה יותר היה קשור ללחץ גבוה יותר [13].\n\n**מחקר Weir ועמיתיו (2006), ס\"מ מים:** 30 נשים בריאות בנות 20–60, מדידה דרך פי הטבעת, שיא הלחץ (חציון) [14].\n\n| פעולה | שיא לחץ (ס\"מ מים) |\n|---|---|\n| הרמת 8 ליברות (כ־3.6 ק\"ג) משיש | 47.7 |\n| כפיפת בטן (crunch) | 68.0 |\n| קימה מכיסא | 70.0 |\n| עלייה במדרגות | 70.0 |\n| הליכה על הליכון | 79.0 |\n| שיעול בינוני בישיבה | 92.3 |\n| קימה משכיבה על הגב | 100.3 |\n| קפיצות פיסוק (jumping jacks) | 126.7 |\n| שיעול חזק בעמידה | 136.0 |\n| הרמת 35 ליברות (כ־16 ק\"ג) מהרצפה | 149.3 |\n\n**מה זה אומר לך:** בנתונים של Weir, **כפיפת בטן לא העלתה את הלחץ יותר מקימה מכיסא**, והרבה פחות משיעול חזק או מהרמה מהרצפה [14]. בסקירה אחרת, הלחץ בכפיפת בטן (curl-up) נע בטווח רחב מאוד בין אנשים, למשל 7–82 ס\"מ מים [15] (לאימות). אולי זה רומז ש**איך** עושים את התנועה חשוב לא פחות מ**איזו** תנועה, אבל זו הסקה ולא ממצא שנמדד.\n\n**עצירת נשימה ולחיצה:** כשלוחצים כלפי מטה עם נשימה עצורה (Valsalva, כמו במאמץ בשירותים), נמדד הלחץ הממוצע הגבוה ביותר מכל 16 התרגילים שנבדקו במחקר של 55 נשים [16]. החוקרים מציעים לשפוט כל תרגיל לפי הלחץ **ביחס ללחץ המקסימלי של אותה אישה**, ולא לפי מספר קבוע [16]. במחקר אחר, גרסאות \"בטוחות לרצפת האגן\" של סקוואט, לאנג\u0027, שכיבות סמיכה ותרגילי בטן לא נמצאו שונות מהגרסאות הרגילות ברוב התרגילים. התקציר עצמו לא עקבי בעניין הזה [17].\n\n**זהירות במסר:** חוקרים מציינים שאין הסכמה איך למדוד את הלחץ בזמן פעילות, ושלא ידוע על \"רף לחץ\" שמעליו נגרמת פגיעה ברצפת האגן [18] (לאימות). לכן לא כדאי להפחיד מתאמנות ב\"נזק מלחץ\".\n\n**השורה התחתונה:** לחץ בבטן הוא דבר טבעי, שעולה בכל מאמץ יומיומי. השאלה היא לא \"איך להימנע מלחץ\", אלא איך הגליל כולו משתף פעולה איתו."},{"title":"שיעור 2: איך נוצרת היפרדות בטנית","sub":"מה בדיוק נמתח, למה זה קורה בהיריון, כמה זה נפוץ, ומה זה גורם או לא גורם.","md":"**בשיעור הזה:** מה בדיוק נמתח, למה זה קורה בהיריון, כמה זה נפוץ, ומה זה גורם או לא גורם.\n\n### האנטומיה: הרקמה נמתחת, השריר לא נקרע\n\n**ישר הבטן** (rectus abdominis) הוא \"שריר הקוביות\": שני חצאים ארוכים, מימין ומשמאל, לאורך הבטן. ביניהם עובר **הלינאה אלבה** (linea alba), כלומר קו החיבור באמצע הבטן. זו רקמת חיבור, לא שריר.\n\n**היפרדות בטנית** (diastasis recti abdominis, DRA, ובעברית גם \"דיאסטזיס\") מוגדרת כהרחקה בין שני החצאים של ישר הבטן [19]. POGP מתארת אותה במילים פשוטות: הרחבה של הרקמות הרכות באמצע הבטן, והתרחקות של שני חצאי השריר [5]. המרחק בין שני החצאים נקרא **IRD** (inter-recti distance).\n\nלפי קליבלנד קליניק, **כשהרחם גדל בהיריון, הלינאה אלבה נעשית דקה ונמתחת לצדדים.** היא אלסטית ו\"חוזרת כמו גומייה\", אבל מתיחה חוזרת עלולה להחליש את הגמישות שלה, ואז הרווח לא תמיד נסגר עד הסוף [20]. היפרדות קיימת גם אצל נשים אחרי גיל המעבר ואצל גברים, לא רק בהיריון [19].\n\n### ומה עם ההורמונים?\n\n**חושבים ש**הורמוני ההיריון מרככים את רקמת החיבור בדופן הבטן, ושזה מצטרף למתיחה של הרחם [21]. אבל המקור הזה הוא סקירה חלשה (חלק מההפניות שלה לא תואמות את המאמרים), והורמונים כמו רלקסין ואסטרוגן מוזכרים בהקשר הזה רק באתר לימודי [22] (לאימות). **לא מצאנו מחקר שמדד ישירות השפעה של הורמונים על הלינאה אלבה.** קליבלנד קליניק מסבירה את ההיפרדות במתיחה של הרחם בלבד, בלי הורמונים [20].\n\n### כמה רחב זה \"רגיל\"?\n\nגם אצל נשים שלא ילדו יש רווח קטן. במחקר על 150 נשים שלא ילדו, הרוחב הממוצע היה כ־7 מ\"מ בעצם החזה, כ־13 מ\"מ 3 ס\"מ מעל הטבור וכ־8 מ\"מ מתחת לטבור. הגבול העליון של \"רגיל\" היה 15, 22 ו־16 מ\"מ בהתאמה [23] (לאימות). ההנחיות של NHS Lothian (מסמך מקצועי לפיזיותרפיסטים) מביאות את אותו ממוצע מעל הטבור [24]. **הרווח הכי רחב באופן טבעי הוא מעל הטבור.**\n\n### איך מחליטים שיש היפרדות? אין הגדרה אחת\n\n| מי | ההגדרה |\n|---|---|\n| Sperstad 2016 (מחקר) | רווח של 2 אצבעות או יותר במישוש, 4.5 ס\"מ מעל הטבור, בטבור או 4.5 ס\"מ מתחתיו [19] |\n| Mota 2015 (מחקר) | יותר מ־16 מ\"מ באולטרסאונד, 2 ס\"מ מתחת לטבור [25] |\n| קליבלנד קליניק | יותר מ־2 ס\"מ, או שתי אצבעות ויותר בבדיקה עצמית [20] |\n| NHS Lothian | במחקרים יש רפים שונים, מיותר מ־1.5 ס\"מ ועד יותר מ־2.7 ס\"מ במנוחה [24] |\n\nלכן אותה אישה יכולה \"להיות עם היפרדות\" לפי מחקר אחד ובלי היפרדות לפי מחקר אחר. אם את מדברת על רוחב, כדאי לומר איך מדדו ואיפה.\n\n### כמה זה נפוץ: כמעט כולן, בסוף ההיריון\n\n**Sperstad ועמיתיה (2016):** 300 נשים בלידה ראשונה בנורווגיה, מישוש באצבעות [19].\n\n| מתי | כמה נשים עם היפרדות |\n|---|---|\n| שבוע 21 להיריון | 33.1% |\n| 6 שבועות אחרי לידה | 60.0% |\n| חצי שנה אחרי לידה | 45.4% |\n| שנה אחרי לידה | 32.6% |\n\nכמעט כל המקרים היו **קלים**. שנה אחרי הלידה היו רק 2 מקרים בינוניים ואף לא מקרה חמור אחד. הרווח היה הכי גדול בגובה הטבור, בכל נקודת זמן [19].\n\n**Mota ועמיתיה (2015):** 84 נשים בלידה ראשונה, אולטרסאונד. **בשבוע 35 להיריון, ל־100% מהנשים היה רווח שעבר את הרף.** אחרי הלידה המספר ירד ל־52.4%, ובחצי שנה ל־39% [19][25].\n\nגם בתוך ההיריון הרווח ממשיך לגדול: אצל נשים בהיריון עם היפרדות, הוא גדל בכ־8 מ\"מ בין שבוע 27 לשבוע 37, בלי קשר לתרגיל [26]. במחקר אחר, הגורם היחיד שניבא את הרווח בשבוע 37 היה הרווח שהיה לפני שבוע 20 [27].\n\n**המסקנה:** הרחבה של קו האמצע בסוף ההיריון היא כמעט כללית. Sperstad לא קוראת לה \"נורמלית\", אבל מציינת שהיפרדות קלה נפוצה מאוד גם בהיריון וגם אחרי הלידה [19].\n\n### מי בסיכון? יש מחלוקת\n\nקליבלנד קליניק מונה כגורמי סיכון: פחות מ־12 חודשים בין הריונות, גיל מעל 35, תאומים, תינוק גדול, מבנה גוף קטן מאוד, ולחיצות בלידה רגילה [20]. אבל המחקרים לא מצאו את רוב הקשרים האלה. ב־Sperstad לא נמצא הבדל לפי גיל, משקל, ניתוח קיסרי, משקל התינוק, גמישות יתר או כמות פעילות גופנית. הסימן היחיד היה הרמה כבדה 20 פעמים בשבוע או יותר, והחוקרות עצמן מבקשות להתייחס לזה בזהירות [19]. ב־Mota לא נמצא קשר ל־BMI, לעלייה במשקל או למשקל התינוק [25].\n\n### החלמה טבעית\n\nאחרי כמה שבועות מהלידה הרווח מתחיל להיסגר, כשהשרירים מתחזקים [20]. לפי עלוני פיזיותרפיה של NHS, היפרדות קטנה משתפרת לרוב תוך 4–8 שבועות (בעלון אחר 6–8), ורחבה יותר יכולה לקחת 6–12 חודשים ולהצריך פיזיותרפיסטית מומחית [28] (לאימות). בניסוי שבו נשים לבשו חגורת תמיכה במשך 8 שבועות אחרי הלידה, הרווח ירד ב־46% (מ־4.6 ל־2.5 ס\"מ), בלי הבדל בין סוגי החגורות. החוקרים עצמם שואלים אם החגורה הוסיפה משהו על ההחלמה הטבעית [29]. **זו סיבה טובה לחשוד בכל טענה ש\"התוכנית שלי סגרה את הרווח\".**\n\n### למה זה קשור, ולמה לא\n\nכאן יש פער בין מה שנפוץ לשמוע לבין מה שמחקרים מצאו.\n\n**מה אתרי בריאות כותבים:** קליבלנד קליניק מונה כסיבוכים אפשריים של היפרדות חמורה או לא מטופלת: בקע בטבור, עצירות, החמרה בכאבי גב, דליפת שתן, כאב ביחסי מין, וכאבי אגן וירכיים [20].\n\n**מה המחקרים מצאו:**\n- סקירה שיטתית (איסוף מסודר של כל המחקרים) של 12 מחקרים ו־2,242 משתתפים: **אין קשר מובהק בין היפרדות לכאבי גב תחתון ואגן, ואין קשר לבריחת שתן.** נמצא קשר קטן לצניחת איברי אגן (prolapse, כשאיברים באגן יורדים מהמקום שלהם). רוחב הרווח אולי קשור לאיכות החיים, לכוח שרירי הבטן ולחומרת כאב הגב. איכות המחקרים הייתה חלשה [30].\n- ב־Sperstad, שנה אחרי לידה, נשים עם ובלי היפרדות דיווחו על אותה כמות של כאב גב ואגן [19]. גם ב־Mota לא היה יותר כאב [25]. במחקר שהשווה 72 נשים, לא נמצא הבדל בבעיות רצפת אגן, בכאב גב או בכאב אגן [31].\n- **יש מחלוקת:** בסקירה מ־2023 של 13 מחקרים, 5 מצאו קשר לכאב גב ו־8 לא מצאו [32] (לאימות). סקירה מ־2022 לא מצאה קשר לבריחת שתן, לכאב גב או לתסמינים מיניים [33] (לאימות).\n\n**בקע:** בספרות הכירורגית היפרדות מופיעה הרבה פעמים יחד עם בקע באמצע הבטן [21]. אתר פילאטיס (כותבת בלי הכשרה רפואית) כותב ש\"אוהל\" או בליטה שנראים בזמן עבודת בטן עלולים להעיד על בקע, ושזה עניין לרופאה [34]. לא מצאנו מקור טוב שמסביר את ההבדל המדויק בין היפרדות לבקע. ניתוח שוקלים כשהרווח רחב מ־3 ס\"מ ויש תסמינים מתמשכים (כאב, חולשה, חוסר שביעות רצון) למרות טיפול שמרני [24].\n\n**השורה התחתונה:** היפרדות היא מתיחה של קו החיבור, היא נפוצה מאוד ולרוב קלה, ומשתפרת הרבה לבד. המחקר לא הראה שהיא גורמת לכאבי גב או לדליפה."},{"title":"שיעור 3: מה המחקר אומר על תרגילים","sub":"מה קורה לרווח ברגע התרגיל, למה \"רווח צר יותר\" לא תמיד טוב יותר, ומה תוכניות תרגילים באמת משיגות.","md":"**בשיעור הזה:** מה קורה לרווח ברגע התרגיל, למה \"רווח צר יותר\" לא תמיד טוב יותר, ומה תוכניות תרגילים באמת משיגות.\n\n### ברגע התרגיל: כפיפה מצמצמת, שאיבה פנימה מרחיבה\n\nשני מושגים:\n- **כפיפת בטן** (curl-up, crunch, head lift): הרמת הראש והכתפיים מהמזרון.\n- **שאיבה פנימה** (drawing-in): הפעלה של השריר הרוחבי, \"להכניס את הבטן התחתונה פנימה\".\n\nכמה מחקרי אולטרסאונד מדדו מה קורה לרווח **באותו רגע**:\n\n| מחקר | מי | כפיפה | שאיבה פנימה / רצפת אגן |\n|---|---|---|---|\n| Pascoal 2014 [35] | 10 אחרי לידה + 10 ביקורת | הרווח ירד מ־13.4 ל־10.7 מ\"מ | לא נבדק |\n| Sancho 2015 [36] | 38 אחרי לידה ראשונה | ירד מעל הטבור, מ־25.9 ל־21.7 מ\"מ | **התרחב** מתחת לטבור, מ־11.4 ל־16.0 מ\"מ |\n| Mota 2015 [37] | 84, משבוע 35 ועד חצי שנה אחרי לידה | הצטמצם כמעט בכל המקומות והזמנים | התרחב מעט אחרי הלידה (1.8–3.0 מ\"מ). **בסוף ההיריון, מתחת לטבור, הצטמצם** (3.8 מ\"מ) |\n| Theodorsen 2019 [39] | 38 אחרי לידה, עם היפרדות | לא נבדק | התרחב: רצפת אגן +1.2, רוחבי +2.8, שניהם יחד +3.9 מ\"מ (מעל הטבור) |\n| Gluppe 2020 [40] | 38 שילדו, עם היפרדות | הרמת ראש: ירד ב־10 מ\"מ מעל הטבור. כפיפה עם סיבוב: 9.4 מ\"מ | התרחב מתחת לטבור ב־2.8 עד 5.0 מ\"מ |\n| Depledge 2021 [41] | 32, שלושה שבועות אחרי לידה | ירד ב־19% | אף תרגיל לא הרחיב את הרווח |\n| Theodorsen 2023 [26] | 38 בהיריון, עם היפרדות | ירד ב־3–4 מ\"מ | התרחב ב־2–5 מ\"מ |\n\n**מה זה אומר:** הכלל הישן \"כפיפת בטן פותחת את הרווח\" לא מתאים לממצאים. ברגע עצמו, כפיפה **מצמצמת** את הרווח. שאיבה פנימה ורצפת אגן מרחיבות אותו **מעט**, בדרך כלל 1–5 מ\"מ. סקירה שיטתית של Gluppe, Engh ו־Bø (2021) כותבת שהממצא הזה סותר את העצה הנפוצה להימנע מכפיפות [42]. חשוב: כל אלה מדידות של רגע אחד, ולא אומרות דבר לבד על מה שקורה לאורך זמן [40].\n\n### רווח צר יותר הוא לא בהכרח טוב יותר (Lee \u0026 Hodges 2016)\n\nדיאן לי ופול הודג\u0027ס (שניהם פיזיותרפיסטים, הודג\u0027ס חוקר באוניברסיטת קווינסלנד) בדקו 26 נשים עם היפרדות ו־17 בלי [38]:\n- **בכפיפה \"טבעית\"** (בלי הכנה), הרווח הצטמצם, בטבור ביותר מסנטימטר, אבל **הלינאה אלבה התעוותה יותר**. כלומר, היא שקעה או התרוממה במקום להישאר מתוחה וישרה.\n- **כשהפעילו קודם את השריר הרוחבי ורק אז עשו כפיפה**, הרווח הצטמצם פחות, וגם **ההתעוותות הייתה קטנה יותר**.\n- אצל הנשים בלי היפרדות לא היה הבדל בין שתי הדרכים.\n\nהחוקרים מציעים שהפעלה מוקדמת של השריר הרוחבי עוזרת להעביר כוח דרך דופן הבטן [38]. ההנחיות של NHS Lothian מסכמות את זה כך: הפעלת השריר הרוחבי לפני ישר הבטן הראתה \"מתח טוב יותר והעברת כוח\" בקו האמצע [24]. הרעיון הזה מעביר את המטרה מ\"לסגור את הרווח\" ל\"לתת לקו האמצע מתח\" [53] (לאימות).\n\n**הסתייגויות חשובות:** מדד ההתעוותות עוד לא תוקף, והחוקרים עצמם אומרים את זה [38]. והמחקר לא הראה שפחות התעוותות מביאה לפחות כאב או לתפקוד טוב יותר. זה ממצא על המנגנון, לא על התוצאה.\n\n### לאורך זמן: תוכניות לא סוגרות את הרווח באופן משמעותי\n\nמושגים: **ניסוי מבוקר** (RCT) = מחקר שבו מגרילים מי מקבלת את התוכנית ומי לא. **מטא־אנליזה** = חיבור סטטיסטי של כמה ניסויים. **רמת ודאות** = כמה אפשר לסמוך על התוצאה.\n\n- **Benjamin ועמיתיה (2023, Physiotherapy):** 16 ניסויים מבוקרים, 698 נשים אחרי לידה. תרגילי בטן לעומת טיפול רגיל צמצמו את הרווח ב**כ־0.43 ס\"מ** (רמת ודאות בינונית). המסקנה: טיפולים שמרניים לא מביאים לצמצום משמעותי קלינית, אבל לתרגול עשויות להיות תועלות גופניות ונפשיות אחרות. לא נמצאו ניסויים בזמן ההיריון [45].\n- **Gluppe, Engh ו־Bø (2021):** 7 ניסויים. אימון שריר רוחבי צמצם ב־0.63 ס\"מ, אבל בוודאות נמוכה מאוד. אימון רצפת אגן לא היה טוב יותר מכמעט כלום. המסקנה: אין מספיק ראיות כדי להמליץ על תוכנית מסוימת [42].\n- **תוכנית רצפת אגן אחרי לידה** (175 נשים) לא הורידה את שיעור ההיפרדות בחצי שנה או בשנה [44] (לאימות).\n- **תוכנית בהיריון** (96 נשים, 12 שבועות, בטן ורצפת אגן משבוע 24) כמעט לא השפיעה על הרווח. הרווח גדל בשתי הקבוצות בהיריון וקטן בשתיהן אחרי הלידה [47].\n- **פילאטיס:** מחקר קטן (35 נשים, 4 שבועות) מצא שיפור ברווח, בהיקף המותניים ובסיבולת הבטן לעומת קבוצת ביקורת [50]. זה מחקר קטן וקצר. לא מצאנו ניסוי פילאטיס באיכות גבוהה. **אין בסיס לפרסם ש\"פילאטיס סוגר היפרדות\".**\n- סקירה ישנה יותר (2014) הגיעה למסקנה שתרגול כללי \"אולי עוזר ואולי לא\" [43] (לאימות).\n\n**יש מחלוקת:** שתי סקירות מסוג אחר (scoping review) מתארות את התרגול כ\"מבטיח\" [48] או כ\"טיפול קו ראשון\" [49], ובאותה נשימה מציינות שהראיות מוגבלות. הסקירות שדירגו את רמת הוודאות (Benjamin 2023 ו־Gluppe 2021) לא מצאו השפעה משמעותית על הרווח [42][45]. כדאי לתת להן יותר משקל.\n\n### האם צריך להימנע מכל כפיפה? המעבר מ\"אסור\" ל\"בהדרגה\"\n\n**מה שהמחקר מראה:**\n- ניסוי מבוקר של Gluppe, Ellström Engh ו־Bø (2023): 70 נשים, חצי שנה עד שנה אחרי לידה, עם היפרדות. 12 שבועות בבית, 5 ימים בשבוע: הרמות ראש, כפיפות בטן וכפיפות עם סיבוב. **הרווח לא השתפר וגם לא החמיר.** השריר התעבה, הכוח עלה, ולא הייתה החמרה בבעיות רצפת אגן או בכאב [46].\n- שלושה שבועות אחרי לידה, אף תרגיל לא הרחיב את הרווח, וכפיפה צמצמה אותו הכי הרבה [41].\n- בהיריון, הרמת ראש וכפיפות צמצמו את הרווח ב־3–4 מ\"מ [26].\n- NHS Lothian מונה תרגילים שצמצמו את הרווח במחקרים, כמו כפיפה, הרמת ראש וכפיפה עם סיבוב, וכותבת שעדיף ללמד אותם עם הפעלה מוקדמת של השריר הרוחבי. **אין ראיה לסוג, תדירות או עוצמה מסוימים** [24]. בתחילת התקופה שאחרי הלידה מתחילים בהפעלה של רצפת האגן והשריר הרוחבי, ואחר כך מתקדמים לכל שרירי הבטן ולתרגילים תפקודיים (לפי הסכמת מומחים מ־2019, שמובאת בהנחיות) [24].\n\n**מה שעלונים ובתי ספר לפילאטיס עדיין אומרים:**\n- עלוני NHS למטופלות: להימנע מתנועות שגורמות לבטן להתרומם ככיפה, כמו כפיפות בטן, \"אלא אם פיזיותרפיסטית מנחה\" [28] (לאימות).\n- Merrithew/STOTT: להימנע מכפיפה, יישור לאחור וסיבוב, או להגביל אותם. יותר מדי כפיפה עלולה להחמיר. מוסיפים מעט כפיפה כשהרווח מתחיל להצטמצם [51].\n- PAA (איגוד הפילאטיס האוסטרלי): להימנע מתרגילים עם \"לחץ תוך בטני מוגבר מדי\" עד שהחיבור לבטן משתפר [52].\n\n**יש מחלוקת**, ובעצם יש פער זמן: המחקר החדש כבר לא אוסר כפיפות, והעלונים ובתי הספר עדיין זהירים. **דרך הביניים שמתאימה לשני הצדדים** היא כפיפה הדרגתית, שמונחית לפי תגובת הגוף: מתחילים בטווח קטן, מפעילים קודם את השריר הרוחבי, מסתכלות על קו האמצע ועל התסמינים, ומקטינים כשמופיעה כיפה [24][38][46].\n\n**השורה התחתונה:** כפיפה לא \"פותחת\" את הרווח, ותרגילים לא \"סוגרים\" אותו. המטרות הריאליות הן כוח, תפקוד וביטחון, בלי להחמיר."},{"title":"שיעור 4: בשיעור","sub":"מה אומרים בזמן התרגיל, על מה מסתכלות, אילו תרגילים מסמנים, ומתי מפנים.","md":"**בשיעור הזה:** מה אומרים בזמן התרגיל, על מה מסתכלות, אילו תרגילים מסמנים, ומתי מפנים.\n\n### הנחיות נשימה והפעלה (מתוך POGP)\n\nהחוברת \"פילאטיס בפיזיותרפיה לבריאות האישה\" של POGP חוזרת על אותו דפוס בכל תרגיל [5]:\n\n1. **שאיפה להכנה:** שואפים מהאף ונותנים לבטן להתרפות.\n2. **נשיפה והפעלה עדינה:** נושפים מהפה, ומפעילים \"בעדינות\" את רצפת האגן ואת שרירי הבטן העמוקים, לפני התנועה ובמהלכה.\n3. **לא עוצרים נשימה ולא לוחצים כלפי מטה.** לספור בקול עוזר להמשיך לנשום.\n4. **שחרור מלא** של רצפת האגן אחרי כל חזרה.\n\n**הדימויים של POGP** [5]:\n- **רצפת האגן:** לדמיין שעוצרים בבת אחת גם גזים וגם שתן, ולהרים \"למעלה וקדימה, מפי הטבעת לכיוון השלפוחית\".\n- **השריר הרוחבי:** האצבעות 2–3 ס\"מ פנימה ולמטה מעצמות האגן הקדמיות. בשאיפה הבטן מתרחבת. בנשיפה \"לדמיין חוט בין עצמות האגן שמתהדק\". הכי קל להרגיש את זה בשכיבה על הצד, \"למשוך את הבטן התחתונה פנימה והרחק מהרצפה\".\n- **בעמידת שש:** \"טבור לעמוד השדרה\".\n- **בגשר:** לקלף את עמוד השדרה כמו מ\"פס סקוטש\" (Velcro).\n- **בצדפה:** לאזן \"כוס מים מלאה\" על הירך העליונה.\n\nעלוני NHS מוסיפים: להחזיק 2–4 שניות × 10 חזרות **ולהמשיך לנשום**, ולהפעיל את רצפת האגן והבטן העמוקה לפני הרמה ושיעול [54] (לאימות). PAA מציעה מגע: בנשיפה לקרב בעדינות את שני צדי הבטן זה לזה עם האצבעות, ולשחרר בשאיפה [52].\n\n**מה ידוע ומה לא:** \"לא לעצור נשימה ולא ללחוץ\" היא ההנחיה עם הכי הרבה תמיכה, כי לחיצה עם נשימה עצורה יוצרת את הלחץ הגבוה ביותר [16]. \"לנשוף במאמץ\" היא דרך טובה למנוע עצירת נשימה, אבל **לא מצאנו מחקר שמראה שהיא מגינה על הלינאה אלבה או על רצפת האגן.** חשוב גם לדעת: הפעלה של רצפת האגן והשריר הרוחבי יחד מרחיבה מעט את הרווח ברגע [26][39]. זה לא אומר שהיא מזיקה. לפי Lee \u0026 Hodges, זה בדיוק מה שנותן מתח לקו האמצע [24][38]. ההנחיה \"zip up\" (לרכוס) לא נמצאה אצל מקור מוסמך.\n\n### על מה מסתכלות: כיפה (doming/coning)\n\n**כיפה** (doming או coning) היא כשהאמצע של הבטן מתרומם לאורך הקו, כמו רכס או אוהל, בזמן מאמץ. זה הסימן הנראה לעין להתעוותות של הלינאה אלבה [38].\n\n- **מה POGP אומרת:** בהרמת רגל לשולחן, \"הבטן לא צריכה להתרומם או ליצור כיפה\". בהרמת ראש, לא לאמץ את הצוואר, לא ללחוץ כלפי מטה ולא לתת לבטן להתרומם [5].\n- **מה עושים כשרואים כיפה:** POGP מציעה לשים את האצבעות על האגן ולהתרכז ב\"משיכת הבטן התחתונה פנימה ולרוחב\" [5]. עלוני NHS: לעצור ולחזור לעבודה של הבטן העמוקה [54] (לאימות).\n- **חשוב:** לא מצאנו מחקר שמראה שתרגול \"דרך\" כיפה מחמיר את ההיפרדות לאורך זמן. כיפה היא סימן להתאים את התרגיל, לא הוכחה לנזק.\n\n**התאמות שאפשר לעשות (מהמקורות):** הנהון ראש ואז חצי כפיפה [52]; הרמת ראש במקום כפיפה מלאה [5]; שכיבות סמיכה על הקיר או בעמידת שש [52]. **הקטנת טווח והקטנת מנוף (רגליים קרובות יותר לגוף) הן הסקה מנתוני הלחץ וההתעוותות, ולא כלל שנבדק.**\n\n### אילו תרגילים מסמנים\n\n| מקור | ממה להימנע או להגביל (בשלב מוקדם) | מה במקום |\n|---|---|---|\n| Merrithew/STOTT [51] | כפיפה, יישור לאחור, סיבוב | להתחיל בעמוד שדרה ניטרלי עם השריר הרוחבי, ולהוסיף כפיפה קטנה בהדרגה |\n| Pilates Anytime [34] (כותבת לא קלינית) | כפיפה קדימה עד שהרווח נסגר; ה־Hundred וסדרת החמש כשהן נשענות רק על ישר הבטן; פלאנק (במיוחד ארוך); שכיבות סמיכה; כפיפות בטן; סיבוב תוך הרמה | עבודה בשכיבה על הצד; תרגילים זקופים כמו Side Kick ו־Mini Swan |\n| PAA / לואיז טאובה [52] | (לפי השלב) פלאנק, שכיבות סמיכה מלאות, כפיפות בטן, ריחוף, רגליים באוויר ב־90/90, יישור לאחור, גלגול למטה וכפיפות. יישור לאחור על כדור עלול לגרום לכיפה | עבודת נשימה; הנהון ראש ← חצי כפיפה; שכיבות סמיכה על קיר או בעמידת שש; סקוואט על קיר; Pointer בעמידת שש |\n| POGP [5] (פיזיותרפיסטיות) | לא אוסרת תרגיל מסוים. מבקשת לראות שאין כיפה | החלקות עקב, הרמת רגל לשולחן, הרמת ראש, גשר (גם עם רגל ישרה), צדפה, פתיחת יד בשכיבה על הצד, פתיחת ברך, הרמת ראש ורגל בשכיבה על הבטן, עמידת שש עם הרמת יד, רגל, ויד ורגל נגדיות, גלגול למטה בעמידה |\n\n**שימי לב:** PAA מסמנת רגליים באוויר ב־90/90, ו־POGP כוללת הרמת רגל לשולחן, עם הדרישה שלא תהיה כיפה [5][52]. זה עוד מקום שבו המקורות לא אחידים. Criss Cross ו־Teaser לא הוזכרו בשמם באף מקור. הם נכנסים לקטגוריות \"כפיפה וסיבוב\" או \"כפיפה עם עומס\" רק בהסקה. בהיריון, חלק מהתרגילים על הגב בחוברת של POGP מסומנים כלא מתאימים אחרי שבוע 20 [5].\n\n### מתי מפנים לפיזיותרפיסטית\n\n**לפי POGP** [5]:\n- כאב בזמן התרגילים או אחריהם.\n- כאב אגן הקשור להיריון.\n- אבחנה של היפרדות: לפנות לפיזיותרפיסטית, ופיזיותרפיסטית מומחית לרצפת האגן \"תלמד אותך את התרגילים המתאימים ביותר\".\n- אחרי לידה: לחכות לאישור רפואי. לפנות לעזרה מקצועית כשיש דימום שמדאיג, פתיחה של פצע בפרינאום (האזור שבין הנרתיק לפי הטבעת) או בבטן, בריחת שתן או צואה, או סימנים של צניחה. אחרי ניתוח בבטן או בנרתיק, לחכות לבדיקה שאחרי הניתוח.\n- פילאטיס עדין נחשב בטוח מ־4 שבועות אחרי הלידה, אם אין חשש לגבי דימום, פצע או בעיה ברצפת האגן.\n\n**לפי הנחיות החזרה לריצה** (Goom, Donnelly ו־Brockwell 2019): כאב אגן או גב תחתון, או דימום שלא קשור למחזור אחרי 8 שבועות, הם סיבה לפנות לפיזיותרפיסטית רצפת אגן [55] (לאימות). דליפה ותחושת כובד מוזכרות כסימני אזהרה של רצפת האגן, אבל לא הצלחנו לאמת את הניסוח המדויק [55] (לאימות).\n\n**לפי הסכמת מומחים בינלאומית (BJSM 2025)** [56]: סימנים שבגללם צריך לעצור ולבדוק לפני פעילות בינונית עד מאומצת בשנה הראשונה אחרי לידה, למשל: כאב או נפיחות בשוק, דימום מהנרתיק שלא קשור למחזור, תסמינים של ניתוח קיסרי שמחמירים בפעילות, כאב בחזה במאמץ, סחרחורת בפעילות, ועייפות קיצונית או אנמיה.\n\n**לפי הזמן:** אם היפרדות קטנה לא משתפרת תוך כמה שבועות, או רחבה לא משתפרת תוך 6–12 חודשים, פונים לפיזיותרפיסטית [28] (לאימות). וכל בליטה או \"אוהל\" שנראים כמו בקע: לרופאה [34].\n\n### מה בתחום שלך ומה לא\n\n**מה מקובל שמדריכה עושה:**\n- לעבוד בתוך ההכשרה שלה, להפנות כשצריך, ולא להציג פילאטיס כתחליף לאבחנה או לטיפול רפואי (קוד של PAA) [57] (לאימות).\n- לזהות מתי משהו מחוץ לתחום שלה ולהפנות לאשת מקצוע רשומה [58] (לאימות).\n- לשאול בטופס הקליטה על היפרדות, לשים לב לכיפה, ולהפנות. זו דרך פעולה שמתאימה למקורות, אבל זו הסקה ולא כלל של גוף מסוים.\n\n**בדיקה עצמית שאפשר ללמד:** לפי NHS Lothian, **\"אפשר ללמד מטופלות לבצע את בדיקת המישוש בעצמן\"** באופן אמין [24]. השיטה ש־Merrithew מציגה למתאמנת: לשכב על הגב, להניח שלוש אצבעות לרוחב כ־5 ס\"מ (2 אינץ\u0027) מעל הטבור, להרים את הראש וללחוץ. רווח של שתי אצבעות ויותר נחשב היפרדות [51]. חשוב להציג את זה כמידע, לא כאבחנה.\n\n**מה שייך לפיזיותרפיסטית:**\n- המדידה המדויקת: האולטרסאונד הוא \"תקן הזהב\". מישוש אמין אצל אותה בודקת, ופחות אמין בין בודקות שונות [24][19].\n- בדיקה מלאה: במנוחה ובכפיפה, בשלוש נקודות (מעל, בגובה ומתחת לטבור), כולל עומק, איכות הרקמה והמתח של הלינאה אלבה. לא רק רוחב [24].\n- בדיקה של רצפת האגן, באופן אידיאלי בבדיקה פנימית של פיזיותרפיסטית מוסמכת [24].\n\n**יש מחלוקת:** Pilates Anytime מציעה שמדריכה שעברה הכשרה לאחרי לידה יכולה למשש, ושרווח של יותר מאצבע אחת צריך בדיקה של רופאה [34]. לפי Merrithew רק שתי אצבעות ויותר הן היפרדות [51]. אם מדריכה ממששת בעצמה תלוי בכללים המקומיים וברמת ההכשרה. **לא חיפשנו כללים ישראליים לתחום העיסוק של מדריכות פילאטיס.**\n\n**השורה התחתונה:** נושפים, מפעילים בעדינות, משחררים עד הסוף. מסתכלות על קו האמצע, מקטינות כשיש כיפה, ומפנות כשיש כאב, דליפה או חשש."},{"title":"שיעור 5: איך להסביר למתאמנת","sub":"משפטים מוכנים לשיעור. כל משפט מבוסס על מקור.","md":"**בשיעור הזה:** משפטים מוכנים לשיעור. כל משפט מבוסס על מקור.\n\n| מה אפשר להגיד | על מה זה מבוסס |\n|---|---|\n| \"הבטן עובדת כמו גליל: שריר הנשימה למעלה, רצפת האגן למטה, שרירי הבטן מסביב. כשכולם עובדים יחד, הבטן מחזיקה את המאמץ.\" | הגליל [1][5][6] |\n| \"היפרדות זה לא קרע בשריר. זה קו החיבור באמצע הבטן שנמתח, כמו גומייה.\" | קליבלנד קליניק, POGP [5][20] |\n| \"זה נפוץ מאוד. בסוף ההיריון כמעט לכל הנשים יש הרחבה כזו.\" | Mota 2015 [25] |\n| \"אצל רוב הנשים זה משתפר מעצמו במהלך השנה הראשונה, ובדרך כלל זה קל.\" | Sperstad 2016 [19] |\n| \"המחקרים לא מצאו שזה גורם לכאבי גב או לדליפת שתן.\" | Benjamin 2019, Sperstad 2016 [19][30] |\n| \"לא צריך לפחד מכפיפות בטן. נתחיל קטן ונראה איך הבטן מגיבה.\" | Gluppe 2023, Depledge 2021 [41][46] |\n| \"קודם נשיפה והפעלה עדינה של הבטן העמוקה, ורק אחר כך מרימות את הראש.\" | Lee \u0026 Hodges 2016, NHS Lothian [24][38] |\n| \"נושפות במאמץ ולא עוצרות נשימה. אם קשה, אפשר לספור בקול.\" | POGP [5] |\n| \"בסוף כל חזרה משחררות לגמרי.\" | POGP [5] |\n| \"אם האמצע של הבטן מתרומם כמו כיפה, נעשה את התרגיל קטן יותר.\" | POGP [5] |\n| \"התרגילים לא סוגרים את הרווח, אבל הם מחזקים, וזה מה שחשוב.\" | Benjamin 2023, Gluppe 2023 [45][46] |\n| \"גם לקום מכיסא או לעלות במדרגות מעלה את הלחץ בבטן, בערך כמו כפיפת בטן.\" | Weir 2006 [14] |\n| \"אני יכולה להראות לך איך לבדוק בעצמך, אבל זו לא אבחנה.\" | NHS Lothian, Merrithew [24][51] |\n| \"פיזיותרפיסטית של רצפת האגן יכולה לבדוק אותך כמו שצריך ולתת לך תרגילים מדויקים.\" | POGP [5] |\n\n**מה לא להגיד:**\n- \"פילאטיס סוגר היפרדות.\" אין ראיה לכך [45][50].\n- \"אסור לך לעשות כפיפות בטן, אף פעם.\" המחקר החדש לא תומך בזה [24][46].\n- \"ההיפרדות תגרום לך לכאבי גב.\" המחקר לא מצא קשר כזה [30].\n- \"הלחץ בבטן יהרוס לך את רצפת האגן.\" לא ידוע על רף לחץ כזה [18] (לאימות).\n- \"יש לך שתי אצבעות, אז יש לך היפרדות.\" זו לא אבחנה, וההגדרות שונות בין מקורות [24]."},{"title":"בדיקה עצמית","sub":"לוחצים על שאלה כדי לראות את התשובה","quiz":[{"q":"מה נמתח בהיפרדות בטנית?","a":"הלינאה אלבה, קו החיבור באמצע הבטן. השריר לא נקרע [5][20]."},{"q":"מה קורה לרווח ברגע כפיפת בטן, ומה בשאיבה פנימה?","a":"בכפיפה הרווח מצטמצם. בשאיבה פנימה ובהפעלת רצפת האגן הוא מתרחב מעט, בדרך כלל 1–5 מ\"מ [26][37][40]."},{"q":"האם רווח צר יותר תמיד טוב יותר?","a":"לא. אצל Lee \u0026 Hodges, בכפיפה בלי הכנה הרווח הצטמצם, אבל קו האמצע התעוות יותר. עם הפעלה מוקדמת של השריר הרוחבי הייתה פחות התעוותות [38]."},{"q":"כמה נשים עדיין עם היפרדות שנה אחרי לידה ראשונה, לפי Sperstad?","a":"32.6%, כמעט כולן קלות [19]."},{"q":"לפי Weir, כפיפת בטן מעלה את הלחץ יותר מקימה מכיסא?","a":"לא. 68 לעומת 70 ס\"מ מים. שיעול חזק (136) והרמה מהרצפה (149.3) גבוהים הרבה יותר [14]."},{"q":"מתאמנת אחרי לידה מספרת שיש לה דליפת שתן וכאב בזמן התרגילים. מה עושים?","a":"מפנים לפיזיותרפיסטית, רצוי מומחית לרצפת האגן. POGP מונה כאב בתרגילים ובריחת שתן כסיבות להפניה [5]."}]},{"title":"מה עוד לא ידוע / לאימות","sub":"","md":"- **הורמונים:** לא נמצא מחקר שמדד את השפעת הרלקסין או הורמונים אחרים על הלינאה אלבה [21][22].\n- **\"לנשוף במאמץ\":** לא נמצא מחקר שבדק אם נשיפה, לעומת עצירת נשימה, משנה את הרווח או את ההתעוותות בכפיפה.\n- **כיפה לאורך זמן:** לא נמצא מחקר שמראה שתרגול עם כיפה מחמיר את ההיפרדות.\n- **מדד ההתעוותות** של Lee \u0026 Hodges עוד לא תוקף, ואין כלי פשוט שמדריכה יכולה למדוד בו \"מתח\" של קו האמצע [38].\n- **תרגילי פילאטיס:** אין מדידות לחץ ל־Hundred, Roll Up או Teaser, ואין ניסוי שהשווה את הגרסאות הקלאסיות לגרסאות מותאמות.\n- **מניעה בהיריון:** אין ניסוי איכותי שבדק אם תרגול בהיריון מונע היפרדות [45].\n- **הקיר האחורי:** חלקם של שרירי הגב העמוקים (multifidus) בלחץ לא נמדד במקורות שמצאנו.\n- **לאימות במקור המלא:** הנחיות החזרה לריצה (Goom 2019) [55]; הנוסח של ACOG על היפרדות ועל כפיפות [59]; העמדה הרשמית של POGP על היפרדות וחזרה לאימון (לא נמצאה מעבר לחוברת הפילאטיס); תקני הרוחב של Beer 2009 [23].\n- **בקע מול היפרדות:** ההבדל המדויק לא אומת במקור טוב.\n- **ישראל:** לא נבדקו כללים ישראליים לתחום העיסוק של מדריכות פילאטיס.\n- **דימויים בלי מקור מוסמך:** \"שפופרת משחת שיניים\" ו־\"zip up\". לא השתמשנו בהם."}],"src":{"1":{"t":"Hodges PW, Gandevia SC. J Appl Physiol 89(3):967-976. 2000. תקציר","u":"https://pubmed.ncbi.nlm.nih.gov/10956340/"},"2":{"t":"Hodges PW ועמיתים. J Physiol. 2001. (לאימות)","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2278995"},"3":{"t":"Hodges PW. Transversus abdominis: a different view of the elephant. סקירה, 2008. (לאימות)","u":"https://www.stmarys.ac.uk/document-library/pdfs/transversus-abdominis-a-different-view-of-the-elephant.pdf"},"4":{"t":"סקירה ב־Medical Research Archives. 2016. (לאימות)","u":"https://esmed.org/MRA/mra/article/download/920/631"},"5":{"t":"POGP (Pelvic, Obstetric and Gynaecological Physiotherapy, רשת מקצועית של פיזיותרפיסטיות בבריטניה). Pilates in Women\u0027s Hea D-->
<script id="app-code" type="text/plain">
/* ===== Storage: everything Shai creates lives on this device (localStorage + IndexedDB for videos) ===== */
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
const DB = Object.assign({ v: 1, plans: [], ex: {}, log: {} }, store.get("shai_db", {}));
const BUILTIN_EX = new Set(Object.keys(EX));
Object.assign(EX, DB.ex);
function save() {
  if (!store.set("shai_db", DB)) toast("השמירה נכשלה. אולי הזיכרון בטלפון מלא.");
  const b = store.get("shai_bk", {}); if (!b.dirty) store.set("shai_bk", { at: b.at || Date.now(), dirty: true });
  if (window.CLOUD) CLOUD.sync();   // send the change to the cloud (retries later if offline)
}
/* Backup reminder: "at" = last backup (or first change), "dirty" = changed since then. Shown after 14 days, "later" hides it for 3 days. */
const BK_DAYS = 14;
function markBackedUp() { store.set("shai_bk", { at: Date.now(), dirty: false }); store.set("shai_bk_snooze", 0); }
function needsBackup() {
  if (window.CLOUD) return false;   // everything is saved in the cloud now
  const b = store.get("shai_bk", {});
  return !!(b.dirty && b.at && Date.now() - b.at > BK_DAYS * 864e5 && Date.now() > (store.get("shai_bk_snooze", 0) || 0));
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const VID = {
  db: null,
  open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try { const r = indexedDB.open("shai-videos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("v"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("v", mode); const req = fn(t.objectStore("v")); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); },
  get(id) { return this.tx("readonly", s => s.get(id)); },
  put(id, blob) { return this.tx("readwrite", s => s.put(blob, id)); },
  del(id) { return this.tx("readwrite", s => s.delete(id)); },
  keys() { return this.tx("readonly", s => s.getAllKeys()); },
};
let videoIds = new Set();
VID.keys().then(k => { videoIds = new Set(k || []); if (S.tab === "lib") render(); }).catch(() => {});

/* ===== Videos in the cloud (private Supabase bucket "videos", one file per exercise id) =====
   This device keeps a copy in IndexedDB (works offline). shai_vid_meta[id]:
   "" = waiting to upload · "big" = too big for the cloud, kept here only · otherwise = the cloud copy's updated_at. */
const VMAX = 50 * 1024 * 1024;
const VSYNC = {
  meta: store.get("shai_vid_meta", {}),
  dels: store.get("shai_vid_del", []),
  cloud: null,   // Map id -> updated_at, after the first successful listing
  p: Promise.resolve(),
  keep() { store.set("shai_vid_meta", this.meta); store.set("shai_vid_del", this.dels); },
  ok: id => /^[A-Za-z0-9_-]{1,200}$/.test(id),
  bucket: () => CLOUD.sb.storage.from("videos"),
  async list() {
    const out = new Map(), sizes = new Map();
    for (let off = 0; ; off += 1000) {
      const r = await this.bucket().list("", { limit: 1000, offset: off });
      if (r.error) throw r.error;
      r.data.forEach(o => { if (o.id) { out.set(o.name, o.updated_at || o.created_at || "x"); sizes.set(o.name, (o.metadata && o.metadata.size) || 0); } });
      if (r.data.length < 1000) break;
    }
    this.sizes = sizes;
    return out;
  },
  run() { if (!window.CLOUD) return Promise.resolve(); return (this.p = this.p.then(() => this._run()).catch(e => console.warn("[shai] video sync failed, will retry", e))); },
  async _run() {
    if (navigator.onLine === false) return;
    for (const id of [...this.dels]) {   // deletions made here
      const r = await this.bucket().remove([id]); if (r.error) throw r.error;
      this.dels = this.dels.filter(x => x !== id); this.keep();
    }
    let local = new Set(await VID.keys().catch(() => []));
    for (const id of local) {   // copies on this device that never reached the cloud (incl. videos from before the cloud)
      if (!this.ok(id) || (this.meta[id] && this.meta[id] !== "full")) continue;
      const blob = await VID.get(id); if (!blob) continue;
      if (blob.size > VMAX) { this.meta[id] = "big"; this.keep(); continue; }
      if (this.cloud) { const u = this.usage(); if (u.bytes - (this.sizes.get(id) || 0) + blob.size > VLIMIT) { this.meta[id] = "full"; this.keep(); continue; } }
      const r = await this.bucket().upload(id, blob, { upsert: true, contentType: blob.type || "video/mp4", cacheControl: "31536000" });
      if (r.error) { if (/maximum|too large|413/i.test(r.error.message + " " + r.error.statusCode)) { this.meta[id] = "big"; this.keep(); continue; } throw r.error; }
      this.meta[id] = "up"; this.keep();
    }
    const cloud = await this.list(); this.cloud = cloud;
    for (const id of local) {
      const m = this.meta[id]; if (!m || m === "big" || m === "full") continue;
      if (!cloud.has(id)) { if (m !== "up") { await VID.del(id).catch(() => {}); delete this.meta[id]; } }   // deleted on the other phone
      else if (m === "up") this.meta[id] = cloud.get(id);
      else if (m !== cloud.get(id)) { await VID.del(id).catch(() => {}); delete this.meta[id]; }   // replaced on the other phone: download again when opened
    }
    this.keep();
    local = new Set(await VID.keys().catch(() => []));
    const next = new Set([...local, ...cloud.keys()]);
    const changed = next.size !== videoIds.size || [...next].some(id => !videoIds.has(id));
    videoIds = next;
    if (changed || vidAlmostFull()) render();
  },
  async blob(id, onDownload) {   // this device's copy, or download from the cloud once and keep it
    let b = await VID.get(id).catch(() => null);
    if (b || !window.CLOUD || !this.ok(id)) return b;
    if (onDownload) onDownload();
    const r = await this.bucket().download(id); if (r.error) throw r.error;
    b = r.data;
    try { await VID.put(id, b); this.meta[id] = (this.cloud && this.cloud.get(id)) || "x"; this.keep(); } catch (e) {}   // phone full: just play it
    return b;
  },
  async remove(id) {
    await VID.del(id).catch(() => {});
    videoIds.delete(id);
    if (window.CLOUD && this.ok(id)) { delete this.meta[id]; if (!this.dels.includes(id)) this.dels.push(id); if (this.cloud) this.cloud.delete(id); this.sizes.delete(id); this.keep(); this.run(); }
  },
  async add(id) {   // the file is already in this device's copy (VID.put)
    videoIds.add(id);
    if (window.CLOUD && this.ok(id)) { this.dels = this.dels.filter(x => x !== id); this.meta[id] = ""; this.keep(); await this.run(); }
  },
  status(id) {   // short note under the video
    if (!window.CLOUD) return "הסרטון נשמר רק בטלפון הזה.";
    const m = this.meta[id];
    if (!videoIds.has(id)) return "הסרטון יישמר בענן, ואפשר לראות אותו מכל טלפון.";
    if (m === "big") return "הסרטון גדול מדי לענן ונשמר רק בטלפון הזה. כדאי להחליף בסרטון קצר יותר.";
    if (m === "full") return "אין מספיק מקום בענן, ולכן הסרטון נשמר רק בטלפון הזה. כדאי להגיד לגיא.";
    if (m === "") return "הסרטון יעלה לענן כשיהיה אינטרנט.";
    return "הסרטון שמור בענן.";
  },
  sizes: new Map(),
  usage() { let bytes = 0; this.sizes.forEach(s => { bytes += s; }); return { n: this.sizes.size, bytes }; },
};
const VLIMIT = 1024 * 1024 * 1024;   // Supabase free plan: 1GB of files
const mb = b => b >= VLIMIT ? (b / VLIMIT).toFixed(1) + "GB" : Math.round(b / 1048576) + "MB";
function vidMeter() {
  if (!window.CLOUD || !VSYNC.cloud) return "";
  const u = VSYNC.usage(), pct = Math.min(100, Math.round(u.bytes / VLIMIT * 100));
  return `<p class="note-local">🎬 ${u.n} ${u.n === 1 ? "סרטון" : "סרטונים"} בענן · ${mb(u.bytes)} מתוך 1GB</p>
    <div class="vmeter ${pct >= 80 ? "full" : ""}" role="img" aria-label="נוצלו ${pct}% מהמקום לסרטונים"><span style="width:${Math.max(pct, u.bytes ? 1 : 0)}%"></span></div>`;
}
function vidAlmostFull() { return !!(window.CLOUD && VSYNC.cloud && VSYNC.usage().bytes >= VLIMIT * 0.8); }
if (window.CLOUD) { VSYNC.run(); window.addEventListener("online", () => VSYNC.run()); }

/* ===== State ===== */
const S = { mode: store.get("shai_mode", "barre"), tab: "plans", plan: null, edit: null, today: store.get("shai_today", []), q: "", area: "", sort: store.get("shai_sort", "default"), src: store.get("shai_src", "all"), confirm: null };
const main = document.getElementById("main");
const overlay = document.getElementById("overlay");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : ""; } catch (e) { return ""; } };
const allPlans = () => [...DB.plans, ...PLANS];
const findPlan = id => allPlans().find(p => p.id === id);
const isMine = p => !!(p && p.own);
const AREAS = ["חימום","בטן","ישבן","רגליים","גב","ידיים וכתפיים","גמישות"];
const GEAR = ["כדור קטן","גומייה","משקולות","טבעת","בר","בלוק או כרית","כיסא"];
const todayISO = () => new Date().toISOString().slice(0, 10);
const ON_OWN_SITE = /^(localhost|127\.0\.0\.1)$|github\.io$/.test(location.hostname);

function toast(msg) {
  const w = document.getElementById("toast-wrap");
  w.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { w.innerHTML = ""; }, 2600);
}
function daysAgo(iso) { const d = Math.round((new Date(todayISO()) - new Date(iso)) / 864e5); return d <= 0 ? "היום" : d === 1 ? "אתמול" : `לפני ${d} ימים`; }
function lastTaught(id) { const l = DB.log[id]; return l && l.length ? l[l.length - 1] : null; }

/* ===== Small pieces ===== */
// which special cases to show for a plan: the one saved on the plan, else what's marked "יש היום בשיעור"
const planPops = p => p && p.pop && POP[p.pop] ? [p.pop] : S.today;
// "not suitable" = the note says so, or says to replace the exercise ("להחליף:")
const notFor = (e, k) => { const v = k && e.x && e.x[k] || ""; return /^\s*לא מתאים/.test(v) || /להחליף:/.test(v); };
function alertsFor(ex, pops) { return (pops || S.today).filter(p => ex.x && ex.x[p]).map(p => notFor(ex, p)
  ? `<div class="alert no"><b>🚫 לא מתאים ל${POP[p]}.</b> ${esc(ex.x[p].replace(/^\s*לא מתאים\s*/, ""))}</div>`
  : `<div class="alert"><b>${POP[p]}:</b> ${esc(ex.x[p])}</div>`).join(""); }
function planPopBox(p, editing) {
  const n = p.pop ? p.s.reduce((a, s) => a + s[2].filter(([id]) => EX[id] && notFor(EX[id], p.pop)).length, 0) : 0;
  return `<div class="today plan-pop"><b>המערך הזה מיועד ל:</b>

  const byName = l => S.sort === "oldest" ? sortPlans(l) : [...l].sort((a, b) => String(a.n).localeCompare(String(b.n), "he", { numeric: true }));
  const groups = ["shai", "web", "general"].filter(g => src === "all" || src === g).map(g => [g, byName(all.filter(p => grp(p) === g))]).filter(([, l]) => l.length);

  const sortChips = mine.length > 1 ? `<div class="chips" role="group" aria-label="סדר"><button type="button" class="chip f" data-a="sort" data-id="default" aria-pressed="${S.sort !== "oldest"}">סדר רגיל</button><button type="button" class="chip f" data-a="sort" data-id="oldest" aria-pressed="${S.sort === "oldest"}">מה שלא עשיתי הכי הרבה זמן</button></div>` : "";

  return `<button type="button" class="btn wide big" data-a="new-plan">+ מערך חדש</button>

/* ===== Share / print a plan ===== */
function planText(p) {   // WhatsApp-friendly (*bold*)
  const out = [`*${p.n}* · ${planMins(p)} דק׳`];
  if (p.d) out.push(p.d);
  p.s.forEach(([name, m, items]) => {
    out.push("", `*${name}*${m ? ` · ${m} דק׳` : ""}`);
    items.forEach(([id, d]) => { const e = EX[id]; if (e) out.push(`• ${e.n}${d ? " – " + d : ""}`); });
  });
  return out.join("\n");
}
async function sharePlan(p) {
  const text = planText(p);
  if (navigator.share) {
    try { await navigator.share({ title: p.n, text }); return; }
    catch (err) { if (err && err.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); toast("המערך הועתק. אפשר להדביק בוואטסאפ."); }
  catch (err) { toast("לא הצלחתי לשתף. נסי שוב."); }
}
function printPlan(p) {

  box.innerHTML = `<h1>${esc(p.n)}</h1><p class="sub">${p.d ? esc(p.d) + " · " : ""}${planMins(p)} דקות · ${S.mode === "barre" ? "בר" : "מזרון"}</p>

}

function mdInline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\(לאימות\)/g, '<span class="verify">לאימות</span>')
    .replace(/\[(\d+)\]/g, '<button type="button" class="cite" data-a="cite" data-id="$1" aria-label="מקור $1">$1</button>');
}
function md(src) {
  const L = String(src || "").split("\n"); let h = "", i = 0;
  const special = /^(### |\||[-*] |\d+\. |> )/;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("### ")) { h += `<h3>${mdInline(l.slice(4))}</h3>`; i++; continue; }
    if (l.startsWith("> ")) { h += `<div class="disclaimer">${mdInline(l.slice(2))}</div>`; i++; continue; }
    if (l.startsWith("|")) {
      const rows = []; while (i < L.length && L[i].startsWith("|")) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
      const body = rows.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r.trim()));
      h += `<div class="tbl"><table><thead><tr>${cells(rows[0]).map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^[-*] /.test(l) || /^\d+\. /.test(l)) {
      const ol = /^\d+\. /.test(l), re = ol ? /^\d+\. / : /^[-*] /, it = [];
      while (i < L.length && re.test(L[i])) it.push(L[i++].replace(re, ""));
      h += `<${ol ? "ol" : "ul"}>${it.map(x => `<li>${mdInline(x)}</li>`).join("")}</${ol ? "ol" : "ul"}>`;
      continue;
    }
    const p = []; while (i < L.length && L[i].trim() && !special.test(L[i])) p.push(L[i++].trim());
    const t = p.join(" ");
    const cls = t.startsWith("**השורה התחתונה") ? "bottom" : t.startsWith("**יש מחלוקת") ? "dispute" : t.startsWith("**בשיעור הזה") ? "hint" : "";
    h += `<p${cls ? ` class="${cls}"` : ""}>${mdInline(t)}</p>`;
  }
  return h;
}

      const v = document.getElementById("bk-in").value.trim();
      if (!v) { toast("קודם מדביקים גיבוי או בוחרים קובץ"); break; }
      if (sheetCtx.armed !== v) { sheetCtx.armed = v; a.textContent = "בטוח? זה יחליף את מה שיש. ללחוץ שוב"; break; }
      restoreFrom(v); break; }
  }
});

// remember whether "עוד הגדרות" is open, so it stays open after each change
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.keep; if (!k) return; if (k === "more") S.moreOpen = e.target.open; else (S.keep = S.keep || {})[k] = e.target.open; }, true);
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "lib-q") { S.q = el.value; const pos = el.selectionStart; render(); const i = document.getElementById("lib-q"); i.focus(); i.setSelectionRange(pos, pos); return; }
  if (el.id === "pick-q" && sheetCtx && sheetCtx.kind === "pick") { sheetCtx.q = el.value.trim(); drawPicker(); return; }
  if (el.id === "wiz-n" && S.wiz) { S.wiz.n = el.value; return; }
  const f = el.dataset && el.dataset.f; if (!f) return;
  const p = findPlan(S.edit); if (!p) return;
  const si = Number(el.dataset.si), ii = Number(el.dataset.ii);
  if (f === "n") p.n = el.value; else if (f === "d") p.d = el.value; else if (f === "sp") p.sp = el.value.trim();
  else if (f === "sec-name") p.s[si][0] = el.value; else if (f === "sec-min") p.s[si][1] = el.value.replace(/[^\d]/g, "");
  else if (f === "dose") p.s[si][2][ii][1] = el.value;
  clearTimeout(save.t); save.t = setTimeout(save, 300);
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "vid-in" && el.files && el.files[0] && sheetCtx) {
    const file = el.files[0], xid = sheetCtx.id;
    el.value = "";
    if (window.CLOUD && file.size > VMAX) { toast("הסרטון גדול מדי (מעל 50MB). צלמי סרטון קצר יותר, עד חצי דקה בערך."); return; }
    if (file.size > 300 * 1024 * 1024) { toast("הסרטון גדול מדי. עדיף סרטון קצר."); return; }
    toast(window.CLOUD ? "שומר ומעלה לענן..." : "שומר את הסרטון...");
    try { await VID.put(xid, file); }
    catch (err) { toast("לא הצלחתי לשמור את הסרטון. אולי אין מקום בטלפון."); return; }
    try { await VSYNC.add(xid); } catch (err) {}
    const m = VSYNC.meta[xid];
    toast(!window.CLOUD ? "הסרטון נשמר" : m === "" ? "הסרטון נשמר בטלפון, ויעלה לענן כשיהיה אינטרנט" : m === "big" ? "הסרטון נשמר רק בטלפון (גדול מדי לענן)" : m === "full" ? "אין מספיק מקום בענן. הסרטון נשמר רק בטלפון." : "הסרטון עלה לענן");
    if (sheetCtx && sheetCtx.id === xid) openEx(xid); render();
  }
  if (el.id === "bk-filein" && el.files && el.files[0]) {
    try { document.getElementById("bk-in").value = await el.files[0].text(); toast("הקובץ נטען. עכשיו לוחצים שחזור."); } catch (err) { toast("לא הצלחתי לקרוא את הקובץ"); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.innerHTML) closeOverlay(); });
document.addEventListener("visibilitychange", async () => {
  if (wakeLock !== null && document.visibilityState === "visible" && document.querySelector(".class-mode")) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});
if ("serviceWorker" in navigator && ON_OWN_SITE) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
if (window.CLOUD && !store.get("shai_tour_ok", 0)) openTour(0, true);
else if (window.CLOUD && !store.get("shai_privacy_ok", 0)) openPrivacy(true);
</script>
